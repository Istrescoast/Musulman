<style>
/* Layout: un téléphone centré sur un fond neutre ; plein écran sur mobile. Navigation par onglets en bas, écrans empilés. */
:root {
  --page: #e7ecea;
  --bg: #f6f8f7;
  --surface: #ffffff;
  --fg: #16302b;
  --muted: #5a726c;
  --line: #d8e2de;
  --accent: #0f5a3e;
  --accent-soft: #e1efe7;
  --on-accent: #ffffff;
  --gold: #a87a22;
  --hero: #0b3a29;
  --hero-fg: #f1d78f;
  --font-display: "Reem Kufi", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-ar: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #050c09; --bg: #09150f; --surface: #102019; --fg: #e3ece9; --muted: #9db3ad;
    --line: #23392f; --accent: #46b383; --accent-soft: #163626; --on-accent: #04190f; --gold: #dcb660;
    --hero: #0f3324; --hero-fg: #ecd08a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #050c09; --bg: #09150f; --surface: #102019; --fg: #e3ece9; --muted: #9db3ad;
  --line: #23392f; --accent: #46b383; --accent-soft: #163626; --on-accent: #04190f; --gold: #dcb660;
  --hero: #0f3324; --hero-fg: #ecd08a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--page); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 24px;
  display: flex; justify-content: center; align-items: flex-start;
}
.phone {
  width: 100%; max-width: 390px; height: min(820px, calc(100vh - 48px));
  background: var(--bg); border: 1px solid var(--line); border-radius: 36px;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
  box-shadow: 0 20px 50px rgba(10, 40, 34, .18);
}
@media (max-width: 480px) {
  body { padding: 0; }
  .phone { max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
}
html.app body { padding: 0; background: var(--bg); }
html.app .phone { max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px;
  min-height: 60px;
}
.topbar h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0; flex: 1; text-wrap: balance; }
.back {
  border: 0; background: var(--accent-soft); color: var(--accent);
  width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
}
.back[hidden] { display: none !important; }
main { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
.screen { display: grid; gap: 16px; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

nav.tabs {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line); background: var(--surface);
  padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
nav.tabs button {
  background: none; border: 0; color: var(--muted); cursor: pointer;
  display: grid; justify-items: center; gap: 2px; font-size: .7rem; padding: 6px 0;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.hero {
  background: var(--hero); color: var(--hero-fg); border-radius: 20px; padding: 18px;
  display: grid; gap: 4px; border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
}
.brand { width: 34px; height: 34px; border-radius: 9px; }
.brand[hidden] { display: none !important; }
.splash {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 14px;
  background: radial-gradient(circle at 50% 40%, #12452f, #061a11 70%); color: #ecd08a; cursor: pointer;
  transition: opacity .5s;
}
.splash img { width: 150px; height: 150px; }
.splash .name { font-family: var(--font-display); font-size: 1.6rem; }
.splash .ar { font-family: var(--font-ar); font-size: 1.3rem; opacity: .85; }
.splash.out { opacity: 0; pointer-events: none; }
.hero .label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.hero .big { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.1; }
.hero .sub { opacity: .9; font-size: .9rem; }
.dates { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.dates strong { color: var(--fg); font-weight: 600; }

.times { display: grid; gap: 2px; }
.times .row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  padding: 10px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.times .row:last-child { border-bottom: 0; }
.times .row.next { color: var(--accent); font-weight: 600; }
.times .ar { font-family: var(--font-ar); color: var(--muted); font-size: 1.05rem; }
.bell { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0; font-size: 1rem; }
.bell[aria-pressed="true"] { color: var(--accent); }

.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 4px; display: grid; justify-items: center; gap: 6px; cursor: pointer;
  color: var(--fg); font-size: .75rem; text-align: center;
}
.tile .ic {
  width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-family: var(--font-ar); font-size: 1.15rem;
}
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.note {
  font-size: .78rem; color: var(--muted); border-left: 3px solid var(--gold);
  padding: 4px 0 4px 10px;
}
.badge {
  display: inline-block; font-size: .65rem; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--gold); border: 1px solid currentColor;
  border-radius: 999px; padding: 1px 7px; vertical-align: 2px; margin-left: 4px;
}

.list { display: grid; gap: 8px; }
.item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; cursor: pointer; text-align: left; color: var(--fg); width: 100%;
}
.item .n {
  width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .85rem;
}
.item .t { font-weight: 600; }
.item .s { font-size: .8rem; color: var(--muted); display: block; font-weight: 400; }
.item .ar { font-family: var(--font-ar); font-size: 1.2rem; color: var(--accent); }

.verse { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.verse:last-child { border-bottom: 0; }
.verse .a { font-family: var(--font-ar); font-size: 1.55rem; line-height: 2; direction: rtl; text-align: right; }
.verse .tr { font-style: italic; color: var(--accent); font-size: .9rem; }
.verse .fr { font-size: .9rem; }
.player {
  display: flex; align-items: center; gap: 12px; background: var(--accent-soft);
  border-radius: 14px; padding: 10px 12px;
}
.play {
  width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent); font-size: 1rem;
}
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 5px 12px; font-size: .8rem; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.compass { display: grid; justify-items: center; gap: 8px; padding: 8px 0; }
.compass svg { width: 260px; max-width: 100%; height: auto; }
.deg { font-family: var(--font-display); font-size: 2rem; }

.step-illu {
  aspect-ratio: 16 / 10; max-width: 100%; border-radius: 16px; background: var(--accent-soft);
  display: grid; place-items: center; color: var(--accent); text-align: center; padding: 12px;
}
.step-illu .ar { font-family: var(--font-ar); font-size: 2rem; }
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .25s; }
.nav-steps { display: flex; gap: 10px; }
.btn {
  flex: 1; border: 0; border-radius: 12px; padding: 12px; cursor: pointer; font-weight: 600;
  background: var(--accent); color: var(--on-accent);
}
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }

table.rakat { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .85rem; }
table.rakat th, table.rakat td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: center; }
table.rakat th:first-child, table.rakat td:first-child { text-align: left; }
table.rakat th { color: var(--muted); font-weight: 500; font-size: .75rem; }

.field { display: grid; gap: 4px; }
.field label { font-size: .8rem; color: var(--muted); }
.field input {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit;
  background: var(--surface); color: var(--fg); font-variant-numeric: tabular-nums;
}
.result { display: grid; gap: 6px; }
.result .big { font-family: var(--font-display); font-size: 1.8rem; color: var(--accent); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; font-variant-numeric: tabular-nums; }

.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
.month .h { color: var(--muted); font-size: .7rem; }
.month .d { padding: 6px 0; border-radius: 8px; display: grid; gap: 0; line-height: 1.2; }
.month .d small { color: var(--muted); font-size: .62rem; }
.month .d.today { background: var(--accent); color: var(--on-accent); }
.month .d.today small { color: var(--on-accent); opacity: .8; }
.month .d.ev { box-shadow: inset 0 0 0 1.5px var(--gold); }

.tasbih { display: grid; justify-items: center; gap: 14px; padding: 12px 0; }
.bead {
  width: 200px; height: 200px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 3rem; font-variant-numeric: tabular-nums;
}
.bead:active { transform: scale(.97); }
.phrase { font-family: var(--font-ar); font-size: 1.8rem; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
// ---------- Mode appli et sauvegarde ----------
const IS_APP = !!window.Android;
const store = {
  get(k, d) { try { const v = localStorage.getItem("nejma." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nejma." + k, JSON.stringify(v)); } catch (e) {} }
};
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
let CITY = store.get("city", { name: "Paris", lat: 48.8566, lng: 2.3522 });
const KAABA = { lat: 21.4225, lng: 39.8262 };
const PRAYERS = [
  { k: "fajr", fr: "Fajr", ar: "الفجر" },
  { k: "sunrise", fr: "Lever du soleil", ar: "الشروق" },
  { k: "dhuhr", fr: "Dhuhr", ar: "الظهر" },
  { k: "asr", fr: "Asr", ar: "العصر" },
  { k: "maghrib", fr: "Maghrib", ar: "المغرب" },
  { k: "isha", fr: "Isha", ar: "العشاء" }
];

// Texte du Coran (arabe uthmani, traduction de Muhammad Hamidullah, translittération Tanzil),
// une sourate par fichier dans quran/. Pour les sourates les plus récitées, la translittération
// est rédigée à la française.
const TRANSLIT = {"1":["Bismi llâhi r-rahmâni r-rahîm","Al-hamdu li-llâhi rabbi l-'âlamîn","Ar-rahmâni r-rahîm","Mâliki yawmi d-dîn","Iyyâka na'budu wa iyyâka nasta'în","Ihdinâ s-sirâta l-mustaqîm","Sirâta lladhîna an'amta 'alayhim, ghayri l-maghdûbi 'alayhim wa la d-dâllîn"],"103":["Wal-'asr","Inna l-insâna lafî khusr","Illa lladhîna âmanû wa 'amilû s-sâlihâti wa tawâsaw bil-haqqi wa tawâsaw bis-sabr"],"106":["Li-îlâfi Quraysh","Îlâfihim rihlata sh-shitâ'i wa s-sayf","Falya'budû rabba hâdha l-bayt","Alladhî at'amahum min jû'in wa âmanahum min khawf"],"108":["Innâ a'taynâka l-kawthar","Fasalli li-rabbika wanhar","Inna shâni'aka huwa l-abtar"],"109":["Qul yâ ayyuha l-kâfirûn","Lâ a'budu mâ ta'budûn","Wa lâ antum 'âbidûna mâ a'bud","Wa lâ ana 'âbidun mâ 'abadtum","Wa lâ antum 'âbidûna mâ a'bud","Lakum dînukum wa liya dîn"],"110":["Idhâ jâ'a nasru llâhi wal-fath","Wa ra'ayta n-nâsa yadkhulûna fî dîni llâhi afwâjâ","Fasabbih bi-hamdi rabbika wastaghfirh, innahû kâna tawwâbâ"],"112":["Qul huwa llâhu ahad","Allâhu s-samad","Lam yalid wa lam yûlad","Wa lam yakun lahû kufuwan ahad"],"113":["Qul a'ûdhu bi-rabbi l-falaq","Min sharri mâ khalaq","Wa min sharri ghâsiqin idhâ waqab","Wa min sharri n-naffâthâti fi l-'uqad","Wa min sharri hâsidin idhâ hasad"],"114":["Qul a'ûdhu bi-rabbi n-nâs","Maliki n-nâs","Ilâhi n-nâs","Min sharri l-waswâsi l-khannâs","Alladhî yuwaswisu fî sudûri n-nâs","Mina l-jinnati wa n-nâs"]};
const JUZ_AMMA = [1, ...Array.from({ length: 37 }, (_, i) => 78 + i)];
const quranCache = {};
let QIDX = null;
const loadIndex = () => QIDX ? Promise.resolve(QIDX) : fetch("quran/index.json").then(r => r.json()).then(d => (QIDX = d));
const loadSurah = n => quranCache[n] ? Promise.resolve(quranCache[n]) : fetch(`quran/${n}.json`).then(r => r.json()).then(d => (quranCache[n] = d));
const surahName = n => QURAN[n - 1].fr;
function surahList(el, nums) {
  const draw = idx => {
    el.innerHTML = "";
    nums.forEach(n => {
      const meta = idx && idx[n - 1];
      const b = h(`<button class="item"><span class="n">${n}</span><span><span class="t">${surahName(n)}</span><span class="s">${meta ? meta[2] + " · " : ""}${QURAN[n - 1].v} versets</span></span><span class="ar">${meta ? meta[1] : ""}</span></button>`);
      b.firstElementChild.addEventListener("click", () => { state.surah = n; go("surah"); });
      el.append(b);
    });
  };
  draw(QIDX);
  if (!QIDX) loadIndex().then(d => { if (el.isConnected) draw(d); }).catch(() => {});
}

const WUDU = [
  ["Intention et Bismillah", "Formuler dans son cœur l'intention de faire les ablutions, puis dire « Bismillah ».", "بسم الله"],
  ["Les mains", "Se laver les mains jusqu'aux poignets, trois fois, en passant entre les doigts.", "×3"],
  ["La bouche", "Se rincer la bouche, trois fois.", "×3"],
  ["Le nez", "Aspirer l'eau par le nez puis la rejeter avec la main gauche, trois fois.", "×3"],
  ["Le visage", "Se laver le visage du front au menton et d'une oreille à l'autre, trois fois.", "×3"],
  ["Les bras", "Laver le bras droit puis le gauche jusqu'aux coudes inclus, trois fois chacun.", "×3"],
  ["La tête", "Passer les mains mouillées sur la tête, de l'avant vers l'arrière puis retour, une fois.", "×1"],
  ["Les oreilles", "Essuyer l'intérieur et l'arrière des oreilles avec les doigts mouillés, une fois.", "×1"],
  ["Les pieds", "Laver le pied droit puis le gauche jusqu'aux chevilles incluses, trois fois chacun.", "×3"],
  ["Invocation finale", "Prononcer l'attestation de foi : « Ash-hadu an lâ ilâha illa llâh, wa ash-hadu anna Muhammadan 'abduhû wa rasûluh ».", "الشهادة"]
];

const SALAT = [
  ["Takbir d'ouverture", "Debout face à la qibla, lever les mains et dire « Allâhu akbar ».", "اللّٰه أكبر"],
  ["Station debout (qiyam)", "Réciter Al-Fatiha, puis une autre sourate dans les deux premières rak'at.", "الفاتحة"],
  ["Inclinaison (ruku')", "S'incliner, mains sur les genoux, et dire trois fois « Subhâna rabbiya l-'adhîm ».", "سبحان ربي العظيم"],
  ["Redressement", "Se relever en disant « Sami'a llâhu liman hamidah », puis « Rabbanâ wa laka l-hamd ».", "سمع الله لمن حمده"],
  ["Prosternation (sujud)", "Se prosterner front, nez, mains, genoux et orteils au sol, et dire trois fois « Subhâna rabbiya l-a'lâ ».", "سبحان ربي الأعلى"],
  ["Assise entre les prosternations", "S'asseoir brièvement et dire « Rabbi ghfir lî ».", "رب اغفر لي"],
  ["Seconde prosternation", "Se prosterner à nouveau comme la première fois. Une rak'a est terminée.", "سجود"],
  ["Tashahhud", "Après la 2e rak'a et à la dernière, s'asseoir et réciter le tashahhud.", "التشهد"],
  ["Salutation finale (taslim)", "Tourner la tête à droite puis à gauche en disant « As-salâmu 'alaykum wa rahmatu llâh ».", "السلام عليكم"]
];

const EVENTS = [
  { m: 1, d: 1, fr: "Nouvel an de l'Hégire" },
  { m: 1, d: 10, fr: "Achoura" },
  { m: 3, d: 12, fr: "Mawlid" },
  { m: 9, d: 1, fr: "Début du Ramadan" },
  { m: 9, d: 27, fr: "Nuit du Destin (estimée)" },
  { m: 10, d: 1, fr: "Aïd al-Fitr" },
  { m: 12, d: 9, fr: "Jour de Arafat" },
  { m: 12, d: 10, fr: "Aïd al-Adha" }
];

const MORE = [
  { id: "ablutions", fr: "Ablutions", s: "Guide pas à pas", ar: "و", v: "V1" },
  { id: "salat", fr: "Apprendre la prière", s: "Positions et récitations", ar: "ص", v: "V1" },
  { id: "zakat", fr: "Calculateur de zakat", s: "Avoirs, nisab, zakat al-fitr", ar: "ز", v: "V1" },

];

// ---------- Calculs ----------
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const fixA = a => ((a % 360) + 360) % 360, fixH = h => ((h % 24) + 24) % 24;
function sunPos(jd) {
  const D = jd - 2451545.0;
  const g = fixA(357.529 + 0.98560028 * D), q = fixA(280.459 + 0.98564736 * D);
  const L = fixA(q + 1.915 * Math.sin(rad(g)) + 0.020 * Math.sin(rad(2 * g)));
  const e = 23.439 - 0.00000036 * D;
  const RA = deg(Math.atan2(Math.cos(rad(e)) * Math.sin(rad(L)), Math.cos(rad(L)))) / 15;
  return { decl: deg(Math.asin(Math.sin(rad(e)) * Math.sin(rad(L)))), eqt: q / 15 - fixH(RA) };
}
// Méthode UOIF : Fajr et Isha à 12°, Asr école shafi'ite (ombre = 1)
function prayerTimes(date, lat, lng) {
  const jd = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000 + 2440587.5 - lng / 360;
  const tz = -date.getTimezoneOffset() / 60;
  const noon = t => fixH(12 - sunPos(jd + t).eqt);
  const angleTime = (a, t, ccw) => {
    const { decl } = sunPos(jd + t);
    const T = deg(Math.acos((-Math.sin(rad(a)) - Math.sin(rad(decl)) * Math.sin(rad(lat))) / (Math.cos(rad(decl)) * Math.cos(rad(lat))))) / 15;
    return noon(t) + (ccw ? -T : T);
  };
  const asr = t => {
    const { decl } = sunPos(jd + t);
    const a = -deg(Math.atan(1 / (1 + Math.tan(rad(Math.abs(lat - decl))))));
    return angleTime(a, t);
  };
  const raw = {
    fajr: angleTime(12, 5 / 24, true), sunrise: angleTime(0.833, 6 / 24, true),
    dhuhr: noon(12 / 24), asr: asr(13 / 24), maghrib: angleTime(0.833, 18 / 24), isha: angleTime(12, 18 / 24)
  };
  const out = {};
  for (const k in raw) {
    const h = raw[k] + tz - lng / 15 + (k === "dhuhr" ? 1 / 60 : 0);
    const d = new Date(date); d.setHours(0, 0, 0, 0); d.setMinutes(Math.round(h * 60));
    out[k] = d;
  }
  return out;
}
function qiblaBearing(lat, lng) {
  const p1 = rad(lat), p2 = rad(KAABA.lat), dl = rad(KAABA.lng - lng);
  return fixA(deg(Math.atan2(Math.sin(dl), Math.cos(p1) * Math.tan(p2) - Math.sin(p1) * Math.cos(dl))));
}
const hijriParts = d => {
  const o = {};
  new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "numeric", year: "numeric" })
    .formatToParts(d).forEach(p => { if (p.type !== "literal") o[p.type] = parseInt(p.value, 10); });
  return o;
};
const hijriLong = d => new Intl.DateTimeFormat("fr-FR-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "long", year: "numeric" }).format(d);
const hijriMonthName = d => new Intl.DateTimeFormat("fr-FR-u-ca-islamic-umalqura", { month: "long" }).format(d);
const hm = d => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const longDate = d => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const euro = n => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });

function nextPrayer(now) {
  let t = prayerTimes(now, CITY.lat, CITY.lng);
  for (const p of PRAYERS) if (p.k !== "sunrise" && t[p.k] > now) return { p, at: t[p.k] };
  const tm = new Date(now); tm.setDate(tm.getDate() + 1);
  return { p: PRAYERS[0], at: prayerTimes(tm, CITY.lat, CITY.lng).fajr };
}
function upcomingEvents(from, count) {
  const res = [];
  const d = new Date(from); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < 400 && res.length < count; i++) {
    const h = hijriParts(d);
    const ev = EVENTS.find(e => e.m === h.month && e.d === h.day);
    if (ev) res.push({ ...ev, date: new Date(d) });
    d.setDate(d.getDate() + 1);
  }
  return res;
}

// ---------- Navigation ----------
const main = document.getElementById("main"), titleEl = document.getElementById("title"), backBtn = document.getElementById("backBtn");
let stack = [], tab = "home", timer = null;
const notif = store.get("notif", { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true });
// Transmet la position et les notifications choisies au téléphone, qui programme les rappels.
function syncNative() {
  if (!IS_APP) return;
  try { Android.setSettings(JSON.stringify({ lat: CITY.lat, lng: CITY.lng, city: CITY.name, notif })); } catch (e) {}
}
let locating = false;
function locate() {
  if (!navigator.geolocation || locating) return;
  locating = true;
  navigator.geolocation.getCurrentPosition(pos => {
    locating = false;
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    let name = "";
    try { if (IS_APP) name = Android.cityName(lat, lng) || ""; } catch (e) {}
    CITY = { name: name || "Ma position", lat, lng };
    store.set("city", CITY); syncNative(); render();
  }, () => { locating = false; }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 3600000 });
}
const state = { surah: 0, wudu: 0, salat: 0, tasbih: 0, phrase: 0 };

function go(screen, push = true) { if (push) stack.push(screen); render(); }
function back() { stack.pop(); render(); }
// Bouton retour du téléphone : revient d'abord en arrière dans l'appli.
window.appBack = () => {
  if (stack.length > 1) { back(); return true; }
  if (tab !== "home") { setTab("home"); return true; }
  return false;
};
function setTab(t) { tab = t; stack = [t]; render(); }
backBtn.addEventListener("click", back);
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

const screens = {};
let onOrient = null;
function render() {
  clearInterval(timer);
  if (onOrient) { window.removeEventListener("deviceorientationabsolute", onOrient); onOrient = null; }
  const id = stack[stack.length - 1];
  const s = screens[id];
  titleEl.textContent = s.title;
  backBtn.hidden = stack.length < 2;
  document.getElementById("brand").hidden = stack.length >= 2;
  main.innerHTML = "";
  const el = document.createElement("div"); el.className = "screen";
  main.appendChild(el); main.scrollTop = 0;
  s.draw(el);
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };

    cd.textContent = `dans ${hh} h ${String(mm).padStart(2, "0")} min ${String(ss).padStart(2, "0")} s`;
  };
  tick(); timer = setInterval(tick, 1000);
}};

screens.qibla = { title: "Direction de la qibla", draw(el) {

}};

  for (let d = new Date(start); hijriParts(d).month === hp.month; d.setDate(d.getDate() + 1)) days.push(new Date(d));

  const i = state[key], s = list[i];

    <span class="small muted">Étape ${i + 1} sur ${list.length}</span>
    ${illu ? `<div class="step-illu"><div><div class="ar">${s[2]}</div><div class="small">Illustration à venir</div></div></div>` : ""}
    <h2>${s[0]}${illu ? "" : ` <span class="badge" style="font-family:var(--font-ar);font-size:.8rem;text-transform:none">${s[2]}</span>`}</h2><p style="margin:0">${s[1]}</p>
    <div class="nav-steps"><button class="btn ghost" id="prev" ${i === 0 ? "disabled" : ""}>Précédent</button>
    <button class="btn" id="next">${i === list.length - 1 ? done : "Suivant"}</button></div>`));
  el.querySelector("#prev").addEventListener("click", () => { state[key]--; render(); });
  el.querySelector("#next").addEventListener("click", () => { if (i < list.length - 1) state[key]++; else { state[key] = 0; back(); return; } render(); });
}

    el.querySelector("#fitr").textContent = euro(v("z-pp") * v("z-pu"));
  };

  };

}};

      refs.querySelector(".seg").append(b);
    });
    box.append(refs);
    box.append(h(`<p class="note">Récits rédigés d'après le Coran ; les détails venant de la tradition sont signalés. À faire relire par une personne de confiance.</p>`));
  }).catch(() => { box.innerHTML = `<span class="small">Impossible de charger ce récit.</span>`; });
}};

// ---------- V3 : Guide funéraire ----------
const FUNERAL = [
  ["Dans les premières heures", [
    "Fermer les yeux du défunt et dire « Innâ lillâhi wa innâ ilayhi râji'ûn »",
    "Faire constater le décès par un médecin (certificat de décès)",
    "Prévenir l'imam ou la mosquée",
    "Contacter des pompes funèbres musulmanes"]],
  ["Démarches en France", [
    "Déclarer le décès à la mairie sous 24 h (souvent fait par les pompes funèbres)",
    "Inhumer entre 24 h et 6 jours ouvrables après le décès (dérogation possible)",
    "Demander une place en carré musulman au cimetière",
    "En cas de rapatriement : autorisation de transport et consulat du pays"]],
  ["Toilette mortuaire (ghusl)", [
    "Réalisée par des personnes du même sexe que le défunt",
    "Lavage du corps selon les étapes du ghusl",
    "Envelopper le corps dans le linceul (kafan)"]],
  ["Prière funéraire (janaza)", [
    "Prière debout, sans inclinaison ni prosternation, avec 4 takbir",
    "Al-Fatiha, salutation sur le Prophète ﷺ, invocations pour le défunt",
    "Prévenir la communauté pour qu'elle y assiste"]],
  ["Inhumation et après", [
    "Coucher le défunt sur le côté droit, face à la qibla",
    "Recevoir les condoléances (trois jours)",
    "Régler les dettes du défunt avant la répartition de l'héritage",
    "Délai de viduité ('idda) pour la veuve : 4 mois et 10 jours"]]
];
const funDone = new Set(store.get("funeraire", []));
screens.funeraire = { title: "Guide funéraire", draw(el) {
  const total = FUNERAL.reduce((a, s) => a + s[1].length, 0);
  el.append(h(`
    <div class="card small">Qu'Allah vous accorde la patience. Ce guide vous accompagne étape par étape. Cochez ce qui est fait.</div>
    <div class="progress" aria-hidden="true"><div style="width:${funDone.size / total * 100}%"></div></div>
    <span class="small muted">${funDone.size} sur ${total} étapes faites</span>
    <div id="fl" style="display:grid;gap:14px"></div>
    <p class="note">Contenu à faire valider par un imam et à vérifier pour les règles françaises en vigueur.</p>`));
  const fl = el.querySelector("#fl");
  FUNERAL.forEach((sec, si) => {
    const c = h(`<div class="card" style="display:grid;gap:4px"><h2>${sec[0]}</h2><div class="times"></div></div>`);
    const tl = c.querySelector(".times");
    sec[1].forEach((txt, ti) => {
      const id = si + "-" + ti, on = funDone.has(id);
      const r = h(`<div class="row" style="grid-template-columns:auto 1fr;cursor:pointer"><span style="font-size:1.1rem">${on ? "✅" : "⬜"}</span><span class="small" style="${on ? "color:var(--muted);text-decoration:line-through" : ""}">${txt}</span></div>`);
      r.firstElementChild.addEventListener("click", () => { on ? funDone.delete(id) : funDone.add(id); store.set("funeraire", [...funDone]); render(); });
      tl.append(r);
    });
    fl.append(c);
  });
}};

setTab("home");
const splash = document.getElementById("splash");
const hideSplash = () => { splash.classList.add("out"); setTimeout(() => splash.remove(), 600); };
splash.addEventListener("click", hideSplash);
setTimeout(hideSplash, 1600);
// Au lancement de l'appli : envoie les réglages au téléphone puis rafraîchit la position.
if (IS_APP) { syncNative(); locate(); }
</script>
