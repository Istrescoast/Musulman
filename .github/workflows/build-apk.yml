name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Polices hors ligne
        run: sh tools/fetch-fonts.sh
      - name: Assembler l'interface
        run: sh tools/assemble.sh
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: |
          cp app/build/outputs/apk/release/app-release.apk Nejma.apk
          cp junior/build/outputs/apk/release/junior-release.apk Nejma-Junior.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nejma
          path: |
            Nejma.apk
            Nejma-Junior.apk
      # Publie l'APK dans une release : téléchargeable directement depuis le téléphone.
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nejma ${{ github.run_number }}
          files: |
            Nejma.apk
            Nejma-Junior.apk
          make_latest: true
